    summary: AI podcast-summary app, live on the App Store with 150+ downloads and 1st place at University Demo Day. I built the AI pipeline (Gemini, Whisper, Deepgram) on a Supabase backend.
    bullets:
      - Users share a Spotify or podcast link, pick a time range, and get a summary of the part they missed. Won 1st place at University Demo Day, hosted by SABAH.HUB and Baku ID.
      - Native iOS app (Swift, SwiftUI) live on the App Store with a companion website and 150+ downloads. An Android version in Kotlin is being prepared for a closed beta.
      - I designed the architecture and set the roadmap and UX, and built it with Claude Code. The app talks to a Supabase backend (Postgres and TypeScript edge functions), so API keys never leave the server.
      - Recap pipeline. It uses the publisher's transcript when there is one, otherwise it transcribes the audio on the server (Whisper via Groq, or Deepgram). Gemini writes the recap and answers follow-up questions. Episodes up to about 8 hours are summarized in parts and then combined (map-reduce).
      - Reliability. The backend switches to another Gemini model when one is down, falls back when a streamed answer stalls, and labels partial recaps clearly. Every key point and quote shows when it was said, so users can check it.
      - Shipped version 4.0 in October 2026, including StoreKit 2 subscriptions with server-side receipt checks. Tests cover end-to-end UI (Maestro), StoreKit and 144 server tests, and release testing caught about 8 release-blocking bugs. The first 10 minutes are recapped in about 19 seconds, and follow-up answers take about 3.
    tags: [Swift, SwiftUI, Supabase, TypeScript, Gemini, Whisper, Deepgram, StoreKit 2]

