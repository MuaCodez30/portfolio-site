featured:
  - name: Multimodal fake content detection
    date: May 2026
    context: ADA University · applied ML project
    metric: FaceForensics++
    lede: A video deepfake detector that looks for inconsistencies across frames instead of single-image artifacts, extended across video and text modalities.
    bullets:
      - Decodes videos into frames, detects and aligns faces, and standardizes inputs for consistent analysis.
      - Extracts ResNet50 frame embeddings and uses temporal differencing to capture inconsistencies over time.
      - Trains and compares classical ML classifiers on the video-level features, with hyperparameter tuning, class-imbalance handling and error analysis.
    tags: [Python, ResNet50, scikit-learn, pandas, NumPy]
    repo: "https://github.com/MuaCodez30/csci-4701-deepfake-detection"

  - name: Diabetes prediction with MLflow
    date: Jul 2025
    context: ADA University · ML capstone · team project
    metric: 72% F1 · XGBoost
    lede: Predicting diabetes from 8 health readings per person. Six models, 5-fold grid search with F1 as the target, and every run tracked in MLflow.
    bullets:
      - Treated impossible zeros (glucose, BMI, insulin) as missing data and imputed them before training. Held out a strict test set.
      - Best model was XGBoost at 72% F1, 81% accuracy, 69% recall and 76% precision on the test split. Random forest reached 69% F1.
      - Weaker models stayed in the write-up (SVM at 61% F1) so the comparison stays honest.
    tags: [Python, scikit-learn, XGBoost, MLflow]
    note: Walkthrough on request

